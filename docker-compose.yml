services:
  geolens:
    build: .
    image: geolens-studio
    container_name: geolens-studio
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
      - ./outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
